version: '3.8'
services:
  postgres:
    container_name: postgres
    image: 'docker.io/library/postgres:latest'
    environment:
      POSTGRES_DB: datos_medicos_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d datos_medicos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: datos_medicos_app
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/datos_medicos_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy